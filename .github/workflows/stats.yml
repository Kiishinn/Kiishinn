name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 */12 * * *" # Setiap 12 jam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Kiishinn
          BRANCH_NAME: output
          UTC_OFFSET: 7

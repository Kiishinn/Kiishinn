name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate Profile Details
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: profile-details.svg
          user: Kiishinn
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Jakarta
          output_action: commit
          committer_branch: output-cards
          config_output: svg

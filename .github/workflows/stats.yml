name: Generate GitHub Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kiishinn
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate Stats Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 << 'PYEOF'
          import json, urllib.request, os

          token = os.environ["GITHUB_TOKEN"]
          headers = {"Authorization": f"token {token}", "User-Agent": "GitHubAction"}

          def api_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Fetch data
          user = api_get("https://api.github.com/users/Kiishinn")
          repos = api_get("https://api.github.com/users/Kiishinn/repos?per_page=100&type=owner")
          events = api_get("https://api.github.com/users/Kiishinn/events?per_page=100")

          name = "Nabil Syawaludin Prima"
          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          stars = sum(r.get("stargazers_count", 0) for r in repos)
          forks = sum(r.get("forks_count", 0) for r in repos)
          commits = len([e for e in events if e.get("type") == "PushEvent"])

          # Language stats
          lang_count = {}
          for r in repos:
              lang = r.get("language")
              if lang:
                  lang_count[lang] = lang_count.get(lang, 0) + 1
          lang_sorted = sorted(lang_count.items(), key=lambda x: -x[1])[:8]
          lang_total = sum(c for _, c in lang_sorted)

          # Language colors
          lang_colors = {
              "JavaScript": "#F1E05A", "TypeScript": "#3178C6", "PHP": "#4F5D95",
              "HTML": "#E34C26", "CSS": "#563D7C", "Python": "#3572A5",
              "Java": "#B07219", "Dart": "#00B4AB", "C++": "#F34B7D",
              "C": "#555555", "Shell": "#89E051", "Vue": "#41B883",
              "Blade": "#F7523F", "Kotlin": "#A97BFF", "Swift": "#F05138",
              "Ruby": "#701516", "Go": "#00ADD8", "Rust": "#DEA584",
          }

          # ============ STATS CARD (redesigned) ============
          stats_items = [
              ("★", "Total Stars", str(stars)),
              ("🍴", "Total Forks", str(forks)),
              ("●", "Commits (30d)", str(commits)),
              ("📁", "Public Repos", str(public_repos)),
              ("👥", "Followers", str(followers)),
          ]

          stats_rows = ""
          for i, (icon, label, value) in enumerate(stats_items):
              y = 70 + i * 32
              stats_rows += f'''
            <g transform="translate(0, {y})">
              <circle cx="36" cy="-4" r="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
              <text x="36" y="0" text-anchor="middle" class="stat-icon">{icon}</text>
              <text x="60" y="0" class="stat-label">{label}</text>
              <text x="310" y="0" text-anchor="end" class="stat-value">{value}</text>
            </g>'''

          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="340" height="260" viewBox="0 0 340 260" fill="none">
          <defs>
            <linearGradient id="statsGrad" x1="0" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00D9FF"/>
              <stop offset="100%" stop-color="#0051FF"/>
            </linearGradient>
          </defs>
          <rect x="0.5" y="0.5" rx="12" width="339" height="259" fill="#0D1117" stroke="#30363D"/>
          <rect x="0.5" y="0.5" rx="12" width="339" height="4" fill="url(#statsGrad)"/>
          <text x="170" y="38" text-anchor="middle" class="card-title">GitHub Stats</text>
          <text x="170" y="54" text-anchor="middle" class="card-subtitle">{name}</text>
          <style>
            .card-title {{ font: 700 16px 'Segoe UI', Ubuntu, sans-serif; fill: #58A6FF; }}
            .card-subtitle {{ font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8B949E; }}
            .stat-icon {{ font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #58A6FF; }}
            .stat-label {{ font: 400 13px 'Segoe UI', Ubuntu, sans-serif; fill: #C9D1D9; }}
            .stat-value {{ font: 700 14px 'Segoe UI', Ubuntu, monospace; fill: #00D9FF; }}
          </style>{stats_rows}
          </svg>'''

          with open("dist/profile-stats.svg", "w", encoding="utf-8") as f:
              f.write(stats_svg)

          # ============ LANGUAGES CARD (redesigned) ============
          lang_rows = ""
          # Combined progress bar at top
          bar_segments = ""
          bar_x = 0
          for i, (lang, count) in enumerate(lang_sorted):
              pct = count / lang_total * 100
              seg_w = round(pct * 2.8)
              color = lang_colors.get(lang, "#8B949E")
              rx = "5 0 0 5" if i == 0 else ("0 5 5 0" if i == len(lang_sorted) - 1 else "0")
              bar_segments += f'<rect x="{bar_x}" y="0" width="{seg_w}" height="10" fill="{color}"/>'
              bar_x += seg_w

          # Language list items
          for i, (lang, count) in enumerate(lang_sorted):
              pct = round(count / lang_total * 100, 1)
              color = lang_colors.get(lang, "#8B949E")
              col = i % 2
              row = i // 2
              x = 25 + col * 155
              y = 90 + row * 28

              lang_rows += f'''
            <g transform="translate({x}, {y})">
              <circle cx="6" cy="-4" r="5" fill="{color}"/>
              <text x="16" y="0" class="lang-name">{lang}</text>
              <text x="120" y="0" class="lang-pct">{pct}%</text>
            </g>'''

          card_h = 90 + ((len(lang_sorted) + 1) // 2) * 28 + 15
          if card_h < 260:
              card_h = 260

          lang_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="340" height="{card_h}" viewBox="0 0 340 {card_h}" fill="none">
          <defs>
            <linearGradient id="langGrad" x1="0" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00D9FF"/>
              <stop offset="100%" stop-color="#0051FF"/>
            </linearGradient>
            <clipPath id="barClip"><rect x="0" y="0" width="280" height="10" rx="5"/></clipPath>
          </defs>
          <rect x="0.5" y="0.5" rx="12" width="339" height="{card_h - 1}" fill="#0D1117" stroke="#30363D"/>
          <rect x="0.5" y="0.5" rx="12" width="339" height="4" fill="url(#langGrad)"/>
          <text x="170" y="38" text-anchor="middle" class="card-title">Most Used Languages</text>
          <text x="170" y="54" text-anchor="middle" class="card-subtitle">Based on {lang_total} repositories</text>
          <g transform="translate(30, 68)" clip-path="url(#barClip)">{bar_segments}</g>
          <style>
            .card-title {{ font: 700 16px 'Segoe UI', Ubuntu, sans-serif; fill: #58A6FF; }}
            .card-subtitle {{ font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8B949E; }}
            .lang-name {{ font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #C9D1D9; }}
            .lang-pct {{ font: 400 12px 'Segoe UI', Ubuntu, monospace; fill: #8B949E; }}
          </style>{lang_rows}
          </svg>'''

          with open("dist/top-languages.svg", "w", encoding="utf-8") as f:
              f.write(lang_svg)

          print(f"✅ Generated stats for {name}")
          print(f"   Stars: {stars}, Forks: {forks}, Commits: {commits}")
          print(f"   Repos: {public_repos}, Followers: {followers}")
          print(f"   Languages: {', '.join(l for l, _ in lang_sorted)}")
          PYEOF

          echo "Generated files:"
          ls -la dist/

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile stats & snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

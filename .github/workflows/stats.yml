name: Generate GitHub Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kiishinn
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate Stats Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 << 'PYEOF'
          import json, urllib.request, os

          token = os.environ["GITHUB_TOKEN"]
          headers = {"Authorization": f"token {token}", "User-Agent": "GitHubAction"}

          def api_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Fetch data
          user = api_get("https://api.github.com/users/Kiishinn")
          repos = api_get("https://api.github.com/users/Kiishinn/repos?per_page=100&type=owner")
          events = api_get("https://api.github.com/users/Kiishinn/events?per_page=100")

          name = user.get("name", "Kiishinn") or "Kiishinn"
          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          stars = sum(r.get("stargazers_count", 0) for r in repos)
          forks = sum(r.get("forks_count", 0) for r in repos)
          commits = len([e for e in events if e.get("type") == "PushEvent"])

          # Language stats
          lang_count = {}
          for r in repos:
              lang = r.get("language")
              if lang:
                  lang_count[lang] = lang_count.get(lang, 0) + 1
          lang_sorted = sorted(lang_count.items(), key=lambda x: -x[1])[:8]
          lang_total = sum(c for _, c in lang_sorted)

          # Language colors
          lang_colors = {
              "JavaScript": "#F1E05A", "TypeScript": "#3178C6", "PHP": "#4F5D95",
              "HTML": "#E34C26", "CSS": "#563D7C", "Python": "#3572A5",
              "Java": "#B07219", "Dart": "#00B4AB", "C++": "#F34B7D",
              "C": "#555555", "Shell": "#89E051", "Vue": "#41B883",
              "Blade": "#F7523F", "Kotlin": "#A97BFF", "Swift": "#F05138",
              "Ruby": "#701516", "Go": "#00ADD8", "Rust": "#DEA584",
          }

          # ============ STATS CARD ============
          stats_items = [
              ("⭐", "Total Stars", str(stars)),
              ("🍴", "Total Forks", str(forks)),
              ("📝", "Total Commits", str(commits)),
              ("📦", "Public Repos", str(public_repos)),
              ("👥", "Followers", str(followers)),
          ]

          stats_rows = ""
          for i, (icon, label, value) in enumerate(stats_items):
              y = 25 + i * 28
              stats_rows += f'''
              <g transform="translate(30, {y})">
                <text class="icon" y="0">{icon}</text>
                <text class="label" x="30" y="0">{label}:</text>
                <text class="value" x="220" y="0">{value}</text>
              </g>'''

          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="220" viewBox="0 0 495 220" fill="none">
            <style>
              .title {{ font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #58A6FF; }}
              .icon {{ font: 400 14px 'Segoe UI', Ubuntu, sans-serif; fill: #C9D1D9; }}
              .label {{ font: 400 14px 'Segoe UI', Ubuntu, sans-serif; fill: #8B949E; }}
              .value {{ font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #58A6FF; }}
            </style>
            <rect x="0.5" y="0.5" rx="10" width="494" height="219" fill="#0D1117" stroke="#30363D"/>
            <text x="25" y="35" class="title">📊 GitHub Stats — {name}</text>
            <g transform="translate(0, 45)">{stats_rows}
            </g>
          </svg>'''

          with open("dist/profile-stats.svg", "w", encoding="utf-8") as f:
              f.write(stats_svg)

          # ============ LANGUAGES CARD ============
          card_height = 55 + len(lang_sorted) * 38
          lang_rows = ""

          for i, (lang, count) in enumerate(lang_sorted):
              pct = round(count / lang_total * 100, 1)
              bar_w = round(pct * 2.5)
              color = lang_colors.get(lang, "#8B949E")
              y = 55 + i * 38

              lang_rows += f'''
            <g transform="translate(25, {y})">
              <text class="lang" y="0">{lang}</text>
              <rect x="0" y="8" width="260" height="8" rx="4" fill="#21262D"/>
              <rect x="0" y="8" width="{bar_w}" height="8" rx="4" fill="{color}"/>
              <text class="pct" x="270" y="18">{pct}%</text>
            </g>'''

          lang_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="350" height="{card_height}" viewBox="0 0 350 {card_height}" fill="none">
            <style>
              .title {{ font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #58A6FF; }}
              .lang {{ font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #C9D1D9; }}
              .pct {{ font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8B949E; }}
            </style>
            <rect x="0.5" y="0.5" rx="10" width="349" height="{card_height - 1}" fill="#0D1117" stroke="#30363D"/>
            <text x="25" y="35" class="title">💻 Most Used Languages</text>{lang_rows}
          </svg>'''

          with open("dist/top-languages.svg", "w", encoding="utf-8") as f:
              f.write(lang_svg)

          print(f"✅ Generated stats for {name}")
          print(f"   Stars: {stars}, Forks: {forks}, Commits: {commits}")
          print(f"   Repos: {public_repos}, Followers: {followers}")
          print(f"   Languages: {', '.join(l for l, _ in lang_sorted)}")
          PYEOF

          echo "Generated files:"
          ls -la dist/

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile stats & snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
